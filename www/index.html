<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#120d0b">
<title>Deserción · Las Salinas</title>
<style>
/* MUNDO: LAS SALINAS. Dos casas de comercio pelean por la quebrada de sal.
   Las tropas son mercenarios a sueldo: el veterano vencido no muere, cambia de patrón.
   ARQUITECTURA: DES (motor, cero DOM, intacto) + ART (todo lo visual, nuevo). */
:root{
  --ink:#120d0b; --wood:#2a1d16; --wood2:#3a2a1f; --line:#5a4232; --bone:#f3ead8; --dim:#b39d84;
  --me:#23b39b; --me-lt:#8ff0d8; --me-dk:#0b4f45;
  --foe:#d6406a; --foe-lt:#ffa3bd; --foe-dk:#6a1431;
  --salt:#f4eee2; --salt2:#d9cdb8; --gold:#e8b54a; --gold-dk:#8a6420;
  --fd:Georgia,"Times New Roman",serif; --fu:"Roboto Condensed","Arial Narrow",Roboto,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
body{background:var(--ink);color:var(--bone);font-family:var(--fu);-webkit-font-smoothing:antialiased;user-select:none;touch-action:manipulation}
#app{position:fixed;inset:0;display:flex;flex-direction:column;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px);
  background:radial-gradient(120% 60% at 50% 0%,#2b1d15 0%,#120d0b 70%)}

/* cabecera: libro de cuentas */
.hdr{display:flex;align-items:center;gap:8px;padding:6px 10px 5px;
  background:linear-gradient(180deg,#3b2a1e,#24180f);border-bottom:2px solid #6b4c34;box-shadow:0 2px 0 #0008}
.hdr .nm{font-family:var(--fd);font-style:italic;font-weight:700;font-size:15px;color:var(--gold);text-shadow:0 1px 0 #000}
.hdr .nm small{display:block;font-style:normal;font-family:var(--fu);font-size:8.5px;letter-spacing:.2em;color:var(--dim);text-transform:uppercase}
.cr{display:flex;gap:6px;margin-left:auto;align-items:center}
.coin{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:50%;
  font-family:var(--fd);font-weight:700;font-size:13px;color:#1b130c;border:2px solid #0006;box-shadow:inset 0 -3px 0 #0003,inset 0 2px 0 #fff6}
.coin.m{background:radial-gradient(circle at 35% 30%,var(--me-lt),var(--me) 60%,var(--me-dk))}
.coin.f{background:radial-gradient(circle at 35% 30%,var(--foe-lt),var(--foe) 60%,var(--foe-dk))}
.cr i{color:var(--dim);font-style:normal;font-size:11px}
.x2{font-family:var(--fd);font-weight:700;font-size:11px;background:linear-gradient(180deg,#fff2c4,var(--gold));color:#2a1b08;
  padding:2px 6px;border-radius:3px;box-shadow:0 0 10px #e8b54a88}
.x2[hidden]{display:none}
.clk{font-family:var(--fd);font-weight:700;font-size:17px;font-variant-numeric:tabular-nums;margin-left:4px;min-width:2.6em;text-align:right}
.clk.late{color:#ff8b6b;animation:beat 1s infinite}
@keyframes beat{0%{transform:scale(1)}12%{transform:scale(1.18)}30%{transform:scale(1)}}
.pulse{animation:hp .9s ease-out}
@keyframes hp{0%{filter:brightness(2.2) saturate(1.6)}100%{filter:none}}

.meters{display:flex;align-items:center;gap:7px;padding:4px 10px;background:#1c130e;border-bottom:1px solid #3a2a1f;
  font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--dim)}
.mbar{flex:1;height:6px;background:#0d0907;border:1px solid #4a3627;border-radius:3px;position:relative;overflow:hidden}
.mbar i{position:absolute;top:0;bottom:0;left:50%;width:50%;background:var(--me);transform-origin:left}
.mbar i.neg{background:var(--foe);transform-origin:right;left:auto;right:50%}
.mbar:after{content:"";position:absolute;left:50%;top:-1px;bottom:-1px;width:1px;background:#e8b54a99}
.meters b{font-variant-numeric:tabular-nums;color:var(--bone);font-size:11px;min-width:2.8em;text-align:right}

.fieldwrap{flex:1;min-height:0;position:relative;display:flex;align-items:center;justify-content:center;background:#0a0706;overflow:hidden}
#field{display:block;touch-action:none}
.toast{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);text-align:center;pointer-events:none;
  background:linear-gradient(180deg,#f3e7cfee,#dccaa8ee);color:#3a2a1c;border:2px solid #7a5838;border-radius:4px;
  box-shadow:0 6px 24px #000a;padding:9px 14px;font-size:12.5px;max-width:82%;line-height:1.35}
.toast b{color:#1d130b;font-family:var(--fd);font-size:14px} .toast[hidden]{display:none}
.banner{position:absolute;left:0;right:0;top:32%;text-align:center;pointer-events:none;opacity:0;
  font-family:var(--fd);font-weight:700;font-style:italic;font-size:clamp(22px,7.4vw,36px);letter-spacing:.02em;
  -webkit-text-stroke:1.5px #1a0f0a;text-shadow:0 4px 0 #1a0f0a,0 0 30px rgba(0,0,0,.9)}
.banner small{display:block;font-style:normal;font-family:var(--fu);font-size:11px;letter-spacing:.3em;-webkit-text-stroke:0;color:var(--bone);opacity:.85}
.banner.show{animation:bn 1.7s cubic-bezier(.2,.9,.3,1)}
@keyframes bn{0%{opacity:0;transform:scale(.4) rotate(-4deg)}16%{opacity:1;transform:scale(1.12) rotate(1deg)}
  28%{transform:scale(1) rotate(0)}80%{opacity:1}100%{opacity:0;transform:translateY(-14px) scale(1)}}

.foerow{display:flex;align-items:center;gap:5px;padding:4px 8px;background:#1c130e;border-top:1px solid #3a2a1f;
  font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}
.foerow>span{flex:none}
.foerow .cards{display:flex;gap:3px;margin-left:auto;flex-wrap:wrap;justify-content:flex-end;min-width:0}
.fc{display:flex;align-items:center;gap:3px;border:1px solid var(--foe-dk);border-radius:3px;padding:2px 5px;font-size:9.5px;
  letter-spacing:.03em;color:var(--bone);background:#3a101e88;white-space:nowrap;text-transform:none}
.fc em{font-style:normal;font-family:var(--fd);font-weight:700;color:var(--foe-lt);font-size:10px}
.fc.v{border-color:var(--gold);box-shadow:inset 0 0 0 1px #e8b54a55} .fc.v em{color:var(--gold)}
.fc.v:after{content:"✦";color:var(--gold);font-size:9px}
.fc.nx{border-style:dashed;opacity:.65}

.bottom{padding:6px 8px 8px;display:flex;flex-direction:column;gap:6px;
  background:linear-gradient(180deg,#3a2a1e,#22170f);border-top:2px solid #6b4c34}
.elixrow{display:flex;align-items:center;gap:7px}
.elixbar{flex:1;height:16px;display:flex;gap:2px;padding:2px;background:#120c08;border:1px solid #5a4232;border-radius:3px;transition:box-shadow .3s}
.elixbar i{flex:1;background:#2a1f17;border-radius:2px;position:relative;overflow:hidden}
.elixbar i.on{background:linear-gradient(180deg,#fffaf0,var(--salt) 45%,var(--salt2));box-shadow:inset 0 -2px 0 #0002}
.elixbar i.part{background:linear-gradient(90deg,#cfc2aa var(--p),#2a1f17 var(--p))}
.elixbar.dbl{box-shadow:0 0 12px #e8b54a99}
.elixbar.dbl i.on{background:linear-gradient(180deg,#fff7d8,#f2cf7a 50%,#c8962f)}
.elixn{font-family:var(--fd);font-weight:700;font-size:18px;color:var(--salt);font-variant-numeric:tabular-nums;min-width:1.3em;text-align:right;text-shadow:0 1px 0 #000}
.elixl{font-size:8.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim)}

.hand{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.card{position:relative;background:linear-gradient(180deg,#efe2c6,#cdb894);border:2px solid #6b4c34;border-radius:6px;padding:3px 3px 3px;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:0;overflow:hidden;transition:transform .09s,box-shadow .09s;box-shadow:0 3px 0 #0008}
.card.sel{transform:translateY(-6px);box-shadow:0 0 0 2px var(--me-lt),0 8px 16px #000a}
.card.off{filter:grayscale(.75) brightness(.6)}
.card.vet{border-color:var(--gold);box-shadow:0 3px 0 #0008,inset 0 0 0 1px #fff3}
.card canvas{width:clamp(34px,10.5vw,56px);height:clamp(34px,10.5vw,56px)}
.card .nm2{font-family:var(--fd);font-weight:700;font-size:10px;text-align:center;line-height:1.05;color:#2a1b10}
.card .cst{position:absolute;left:2px;top:2px;width:18px;height:18px;display:flex;align-items:center;justify-content:center;
  font-family:var(--fd);font-weight:700;font-size:12px;color:#2a1b10;background:linear-gradient(180deg,#fff,#d9cdb8);
  clip-path:polygon(50% 0,100% 30%,100% 75%,50% 100%,0 75%,0 30%);z-index:2}
.card .fill{position:absolute;left:0;right:0;bottom:0;background:#0007;pointer-events:none}
.card .vtag{position:absolute;right:3px;top:2px;font-size:11px;color:#a8741c;z-index:2}

.nxt{display:flex;align-items:center;gap:5px;font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}
.nxt canvas{width:24px;height:24px;border-radius:3px}
.nxt .sp{margin-left:auto;display:flex;gap:5px}
.sbtn{font-family:var(--fu);font-weight:600;font-size:10px;letter-spacing:.1em;text-transform:uppercase;border-radius:3px;
  padding:4px 9px;border:1px solid #6b4c34;background:#1c130e;color:var(--dim);cursor:pointer}
.sbtn.on{border-color:var(--gold);color:var(--gold)}

.over{position:absolute;inset:0;z-index:9;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:10px;background:radial-gradient(circle at 50% 40%,#2b1d15f2,#0a0706f7);text-align:center;padding:18px;animation:ov .6s ease-out}
@keyframes ov{from{opacity:0}to{opacity:1}}
.over h2{font-family:var(--fd);font-style:italic;margin:0;font-size:34px;color:var(--gold);text-shadow:0 3px 0 #000}
.over.lose h2{color:var(--foe-lt)} .over.draw h2{color:var(--dim)}
.over p{margin:0;font-size:13px;color:var(--dim);max-width:30em;line-height:1.5}
.over .big{display:flex;gap:10px;align-items:center}
.over .big .coin{width:46px;height:46px;font-size:24px}
.over .big i{font-style:normal;color:var(--dim)}
.btn{font-family:var(--fd);font-weight:700;font-size:14px;padding:10px 22px;border-radius:5px;border:2px solid #6b4c34;
  background:linear-gradient(180deg,#f6e8c8,#d2b98c);color:#2a1b10;cursor:pointer;box-shadow:0 4px 0 #000a}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 #000a}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app">
  <div class="hdr">
    <span class="nm">Deserción<small>Las Salinas</small></span>
    <div class="cr"><span class="coin m" id="crM">0</span><i>almacenes</i><span class="coin f" id="crF">0</span></div>
    <span class="x2" id="x2" hidden>SAL ×2</span><b class="clk" id="clk">3:00</b>
  </div>
  <div class="meters">
    <span>Sal</span><div class="mbar"><i id="advI"></i></div><b id="advN">0.0</b>
    <span style="margin-left:6px">Desertores</span><b id="desN" style="min-width:2.6em">0–0</b>
  </div>
  <div class="fieldwrap" id="fieldwrap">
    <canvas id="field"></canvas>
    <div class="banner" id="banner"></div>
    <div class="toast" id="toast"></div>
    <div id="overBox"></div>
  </div>
  <div class="foerow"><span>Casa Bermeja</span><div class="cards" id="foeCards"></div></div>
  <div class="bottom">
    <div class="elixrow"><span class="elixl">Sal</span><div class="elixbar" id="elixbar"></div><div class="elixn" id="elixn">5</div></div>
    <div class="hand" id="hand"></div>
    <div class="nxt">
      <span>Próxima</span><span id="nextWrap"></span>
      <div class="sp">
        <button class="sbtn" id="btnHelp" type="button">Cómo</button>
        <button class="sbtn" id="btnSnd" type="button">Sonido</button>
        <button class="sbtn" id="btnPause" type="button">Pausa</button>
      </div>
    </div>
  </div>
</div>

<script>
/* ╔══════════════════════════════════════════════════════════════╗
   ║  DESERCIÓN — MOTOR                                            ║
   ║  Lógica pura en tiempo real. CERO DOM, cero dibujo.           ║
   ║  La capa gráfica lee DES.state() y vacía DES.drain().         ║
   ║  NO MODIFICAR: el balance está medido.                        ║
   ╚══════════════════════════════════════════════════════════════╝ */
var DES = (function(){
  "use strict";

  /* ── campo ── */
  var W=1000, H=1700;
  var RT=760, RB=880;                  // río
  var BR=[260,740], BRW=84;            // puentes
  var MATCH=180, DOUBLE=60;            // segundos de partido / de elixir doble
  var MAXE=10, REGEN=2.8;              // 1 elixir cada REGEN segundos

  /* ── reglas de deserción ──
     Una tropa vencida POR OTRA TROPA cambia de bando con el 40% de su vida
     máxima actual, y esa vida pasa a ser su nuevo máximo: cada vez que cambia
     de manos se marchita. A la tercera deserción se destruye.
     Las torres y los edificios NO convierten: destruyen. Los hechizos tampoco. */
  /* Medido en 140 partidas por configuración:
       · si desertan TODAS las tropas -> 45 deserciones por partido y la bola de
         nieve sube al 65%: la mecánica se vuelve ruido y el que gana el primer
         cambio gana el partido.
       · sólo las VETERANAS (Alabardero, Ariete, Coloso) -> 13 por partido y la
         bola de nieve queda en 52%, o sea neutra. Esta es la configuración.
     Las tropas baratas caen y ya está: el drama es perder a las caras. */
  var DESERT_HP=0.40, DESERT_MAX=2;

  var CARDS={
    reclutas:  {name:"Reclutas",   cost:2, n:3, hp:130,  dmg:58,  rate:1.2, range:28,  sight:280, spd:142, r:16, art:"recluta", tag:"enjambre"},
    estandarte:{name:"Estandarte", cost:2, spell:"recall", radius:230, art:"estandarte", tag:"hechizo"},
    alabardero:{name:"Alabardero", vet:1, cost:3, n:1, hp:640,  dmg:155, rate:1.1, range:30,  sight:300, spd:86,  r:22, art:"alabardero", tag:"tropa"},
    ballesteras:{name:"Ballesteras",cost:3, n:2, hp:210, dmg:102, rate:1.1, range:250, sight:300, spd:82,  r:17, art:"ballestera", tag:"a distancia"},
    mina:      {name:"Mina",       cost:3, build:true, hp:620, dmg:132, rate:1.2, range:285, sight:285, spd:0, r:26, life:30, art:"mina", tag:"edificio"},
    purga:     {name:"Purga",      cost:3, spell:"damage", dmg:430, radius:195, art:"purga", tag:"hechizo"},
    ariete:    {name:"Ariete", vet:1,     cost:4, n:1, hp:1050, dmg:205, rate:1.5, range:30, sight:0, spd:150, r:24, onlyB:true, art:"ariete", tag:"asedio"},
    coloso:    {name:"Coloso", vet:1,     cost:5, n:1, hp:3050, dmg:265, rate:0.8, range:32, sight:0, spd:52,  r:34, onlyB:true, art:"coloso", tag:"tanque"}
  };
  var DECK=["reclutas","estandarte","alabardero","ballesteras","mina","purga","ariete","coloso"];

  var S=null, EV=[];
  function ev(o){ EV.push(o); if(EV.length>240) EV.shift(); }

  function shuf(a){ for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t; } return a; }

  function fresh(){
    var s={
      t:0, over:null, units:[], uid:1,
      elix:{me:5,foe:5}, spent:{me:0,foe:0}, deserts:{me:0,foe:0},
      hand:{me:[],foe:[]}, queue:{me:[],foe:[]},
      towers:[
        {id:"f0",side:"foe",kind:"guard", lane:0,x:260,y:320, hp:1000,max:1000,dmg:100,rate:1.2,range:340,r:48,cd:0,on:true},
        {id:"f1",side:"foe",kind:"guard", lane:1,x:740,y:320, hp:1000,max:1000,dmg:100,rate:1.2,range:340,r:48,cd:0,on:true},
        {id:"fK",side:"foe",kind:"throne",lane:-1,x:500,y:150,hp:1700,max:1700,dmg:120,rate:1.0,range:320,r:60,cd:0,on:false},
        {id:"m0",side:"me", kind:"guard", lane:0,x:260,y:1380,hp:1000,max:1000,dmg:100,rate:1.2,range:340,r:48,cd:0,on:true},
        {id:"m1",side:"me", kind:"guard", lane:1,x:740,y:1380,hp:1000,max:1000,dmg:100,rate:1.2,range:340,r:48,cd:0,on:true},
        {id:"mK",side:"me", kind:"throne",lane:-1,x:500,y:1550,hp:1700,max:1700,dmg:120,rate:1.0,range:320,r:60,cd:0,on:false}
      ],
      aiCd:0.7
    };
    ["me","foe"].forEach(function(sd){
      s.queue[sd]=shuf(DECK.slice());
      s.hand[sd]=[s.queue[sd].pop(),s.queue[sd].pop(),s.queue[sd].pop(),s.queue[sd].pop()];
    });
    return s;
  }

  function dbl(){ return S.t > MATCH-DOUBLE; }
  function regen(){ return (dbl()?2:1)/REGEN; }
  function crowns(side){ var n=0; S.towers.forEach(function(t){ if(t.side!==side&&t.hp<=0) n++; }); return n; }
  function noGuards(side){ return S.towers.filter(function(t){ return t.side===side&&t.kind==="guard"&&t.hp>0; }).length===0; }

  /* ── despliegue ── */
  function canDeploy(side,x,y){
    if(side==="me"){
      if(y>RB+30) return true;
      for(var i=0;i<S.towers.length;i++){
        var t=S.towers[i];
        if(t.side==="foe"&&t.kind==="guard"&&t.hp<=0){
          var c0=t.lane===0?0:500;
          if(x>=c0&&x<=c0+500&&y>240) return true;
        }
      }
      return false;
    }
    if(y<RT-30) return true;
    for(var j=0;j<S.towers.length;j++){
      var t2=S.towers[j];
      if(t2.side==="me"&&t2.kind==="guard"&&t2.hp<=0){
        var c1=t2.lane===0?0:500;
        if(x>=c1&&x<=c1+500&&y<H-240) return true;
      }
    }
    return false;
  }

  function deploy(side,key,x,y){
    var C=CARDS[key];
    if(!C || S.over || S.elix[side] < C.cost) return false;
    var hi=S.hand[side].indexOf(key);
    if(hi<0) return false;
    if(!C.spell && !canDeploy(side,x,y)) return false;

    S.elix[side]-=C.cost; S.spent[side]+=C.cost;
    S.hand[side].splice(hi,1);
    if(!S.queue[side].length) S.queue[side]=shuf(DECK.slice());
    S.hand[side].push(S.queue[side].pop());
    S.queue[side].unshift(key);

    if(C.spell==="damage"){
      ev({t:"spell",kind:"purga",x:x,y:y,r:C.radius,side:side});
      S.units.forEach(function(u){
        if(u.side===side||u.hp<=0) return;
        if(Math.hypot(u.x-x,u.y-y)<=C.radius+u.r){ u.hp-=C.dmg; u.killer="spell"; }
      });
      S.towers.forEach(function(t){
        if(t.side===side||t.hp<=0) return;
        if(Math.hypot(t.x-x,t.y-y)<=C.radius+t.r) hurtTower(t,Math.round(C.dmg*0.32),side);
      });
      reap();
      return true;
    }
    if(C.spell==="recall"){
      /* Estandarte: los que desertaron de tu lado vuelven con vos. */
      ev({t:"spell",kind:"estandarte",x:x,y:y,r:C.radius,side:side});
      var back=0;
      S.units.forEach(function(u){
        if(u.side===side||u.hp<=0) return;
        if(u.origin!==side) return;
        if(Math.hypot(u.x-x,u.y-y)>C.radius+u.r) return;
        u.side=side; u.tgt=null; u.cd=0.4; back++;
        ev({t:"desert",x:u.x,y:u.y,to:side,id:u.id,recall:true,art:u.art});
      });
      ev({t:"recallDone",n:back,side:side});
      return true;
    }

    var n=C.n||1, lane = x<500?0:1;
    for(var i=0;i<n;i++){
      var off=(i-(n-1)/2)*44;
      S.units.push({
        id:S.uid++, side:side, origin:side, key:key, art:C.art,
        x:Math.max(34,Math.min(W-34,x+off)), y:y,
        hp:C.hp, max:C.hp, base:C.hp, turns:0,
        cd:0.35, lane:lane, life:C.life||0, born:0.3, killer:null,
        r:C.r, spd:C.spd, dmg:C.dmg, rate:C.rate, range:C.range, sight:C.sight,
        onlyB:!!C.onlyB, build:!!C.build, vet:!!C.vet
      });
      ev({t:"spawn",x:x+off,y:y,side:side,art:C.art});
    }
    return true;
  }

  function hurtTower(t,d,bySide){
    if(t.hp<=0) return;
    t.hp-=d;
    var k=S.towers.filter(function(x){ return x.side===t.side&&x.kind==="throne"; })[0];
    if(k) k.on=true;
    ev({t:"hit",x:t.x,y:t.y,dmg:d,tower:true,side:bySide});
    if(t.hp<=0){
      t.hp=0;
      ev({t:"towerFall",x:t.x,y:t.y,side:t.side,kind:t.kind});
      if(t.kind==="throne") S.over = t.side==="me" ? "foe" : "me";
    }

  /* ── el corazón del juego ── */
  function reap(){
    for(var i=S.units.length-1;i>=0;i--){
      var u=S.units[i];
      if(u.hp>0) continue;
      // Sólo las veteranas desertan. Las demás simplemente caen.
      var byTroop = u.killer && u.killer!=="spell" && u.killer!=="tower" && u.killer!=="expire" && !!u.vet;
      if(byTroop && u.turns < DESERT_MAX && !u.build){
        var to = u.killer;
        u.turns++;
        u.max = Math.max(1, Math.round(u.max*DESERT_HP));
        u.hp  = u.max;
        u.side = to;
        u.tgt=null; u.cd=0.45; u.killer=null;
        ev({t:"desert",x:u.x,y:u.y,to:to,id:u.id,turns:u.turns,art:u.art});
        S.deserts[to]++;
        continue;
      }
      ev({t:"destroy",x:u.x,y:u.y,side:u.side,art:u.art,
          why: u.killer==="spell"?"spell":(u.killer==="tower"?"tower":(u.killer==="expire"?"expire":"withered"))});

  /* ── objetivos ── */
  function targetTowers(side){
    var ts=S.towers.filter(function(t){ return t.side!==side&&t.hp>0&&(t.kind!=="throne"||noGuards(t.side)); });
    if(ts.length) return ts;
    return S.towers.filter(function(t){ return t.side!==side&&t.kind==="throne"&&t.hp>0; });
  }
  function laneTower(u){
    var ts=targetTowers(u.side), best=null, bd=1e9;
    ts.forEach(function(t){
      var d=Math.hypot(t.x-u.x,t.y-u.y);
      if(t.lane===u.lane) d-=280;
      if(d<bd){ bd=d; best=t; }
    });
    return best;
  }
  function findTarget(u){
    if(!u.onlyB){
      var best=null,bd=1e9;
      for(var i=0;i<S.units.length;i++){
        var e=S.units[i];
        if(e.side===u.side||e.hp<=0) continue;
        var d=Math.hypot(e.x-u.x,e.y-u.y);
        if(d<=u.sight && d<bd){ bd=d; best=e; }
      }
      if(best) return best;
      var bt=null,btd=1e9;
      S.towers.forEach(function(t){
        if(t.side===u.side||t.hp<=0) return;
        var d=Math.hypot(t.x-u.x,t.y-u.y);
        if(d<=u.sight+t.r && d<btd){ btd=d; bt=t; }
      });
      if(bt) return bt;
    }
    if(u.build) return null;
    return laneTower(u);
  }

  /* ── paso fijo ── */
  function step(dt){
    if(S.over) return;
    S.t+=dt;
    S.elix.me=Math.min(MAXE,S.elix.me+regen()*dt);
    S.elix.foe=Math.min(MAXE,S.elix.foe+regen()*dt);

    for(var i=0;i<S.units.length;i++){
      var u=S.units[i];
      if(u.hp<=0) continue;
      if(u.born>0) u.born-=dt;
      if(u.life>0){ u.life-=dt; if(u.life<=0){ u.hp=0; u.killer="expire"; continue; } }

      var tgt=findTarget(u);
      u.tgt = tgt ? (tgt.id||tgt.kind) : null;
      if(!tgt) continue;
      var d=Math.hypot(tgt.x-u.x,tgt.y-u.y);

      if(d <= u.range + (tgt.r||0) + u.r){
        u.cd-=dt;
        if(u.cd<=0){
          u.cd=1/u.rate;
          if(tgt.kind) hurtTower(tgt,u.dmg,u.side);
          else { tgt.hp-=u.dmg; tgt.killer = u.build ? "tower" : u.side;   // los edificios destruyen
                 ev({t:"hit",x:tgt.x,y:tgt.y,dmg:u.dmg,side:u.side}); }
        }
        continue;
      }
      if(u.spd<=0) continue;

      var tx=tgt.x, ty=tgt.y;
      var uB=u.y>RB, uA=u.y<RT, tB=tgt.y>RB, tA=tgt.y<RT;
      if((uB&&tA)||(uA&&tB)){
        var bx = Math.abs(u.x-BR[0])<Math.abs(u.x-BR[1]) ? BR[0] : BR[1];
        if(Math.abs(u.x-bx) > BRW-12){ tx=bx; ty = uB ? RB+28 : RT-28; }
        else { tx=bx; ty = uB ? RT-32 : RB+32; }
      }
      var dx=tx-u.x, dy=ty-u.y, m=Math.hypot(dx,dy)||1;
      u.x += dx/m*u.spd*dt;
      u.y += dy/m*u.spd*dt;
      u.x = Math.max(u.r, Math.min(W-u.r, u.x));
    }

    for(var a=0;a<S.units.length;a++){
      var A=S.units[a]; if(A.hp<=0||A.build) continue;
      for(var b=a+1;b<S.units.length;b++){
        var B=S.units[b]; if(B.hp<=0||B.build) continue;
        var ddx=B.x-A.x, ddy=B.y-A.y, dd=Math.hypot(ddx,ddy), mn=A.r+B.r;
        if(dd>0.01 && dd<mn){
          var p=(mn-dd)/2/dd;
          A.x-=ddx*p; A.y-=ddy*p; B.x+=ddx*p; B.y+=ddy*p;
        }
      }
    }

    S.towers.forEach(function(t){
      if(t.hp<=0||!t.on) return;
      t.cd-=dt;
      var best=null,bd=1e9;
      S.units.forEach(function(u){
        if(u.side===t.side||u.hp<=0) return;
        var d=Math.hypot(u.x-t.x,u.y-t.y);
        if(d<=t.range+u.r && d<bd){ bd=d; best=u; }
      });
      if(best && t.cd<=0){
        t.cd=1/t.rate;
        best.hp-=t.dmg; best.killer="tower";      // las torres destruyen: no hay deserción
        ev({t:"shot",x:t.x,y:t.y,tx:best.x,ty:best.y,side:t.side});
      }
    });

    reap();

    S.aiCd-=dt;
    if(S.aiCd<=0){ S.aiCd=0.5; ai(); }

    if(!S.over && S.t>=MATCH){
      var cm=crowns("me"), cf=crowns("foe");
      if(cm!==cf) S.over = cm>cf ? "me":"foe";
      else {
        var lm=lowGuard("me"), lf=lowGuard("foe");
        S.over = lm===lf ? "draw" : (lm>lf ? "me":"foe");
      }
    }
  }
  function lowGuard(side){
    var v=1e9; S.towers.forEach(function(t){ if(t.side===side&&t.kind==="guard") v=Math.min(v,t.hp); });
    return v===1e9?0:v;
  }

  /* ── IA ──
     Juega con la regla de deserción en la cabeza: prefiere limpiar con torre o
     con Purga antes que arriesgar un cambio, y usa Estandarte cuando el rival
     tiene tropas que desertaron de su lado. */
  function ai(){
    if(S.over) return;
    var hand=S.hand.foe.filter(function(k){ return CARDS[k].cost<=S.elix.foe; });
    if(!hand.length) return;

    var threats=S.units.filter(function(u){ return u.side==="me" && u.y<RB+140; });
    var mine=S.units.filter(function(u){ return u.side==="foe"; });

    // ¿tengo desertores míos peleando para el rival cerca? recuperarlos
    var lost=S.units.filter(function(u){ return u.side==="me" && u.origin==="foe" && u.y<RB+200; });
    if(lost.length>=2 && hand.indexOf("estandarte")>=0){
      var lx=lost.reduce(function(a,u){return a+u.x;},0)/lost.length;
      var ly=lost.reduce(function(a,u){return a+u.y;},0)/lost.length;
      if(deploy("foe","estandarte",lx,ly)) return;
    }

    if(threats.length){
      var lane = threats.reduce(function(a,u){ return a+(u.x<500?-1:1); },0) <= 0 ? 0 : 1;
      var tx = lane===0?260:740;
      var front = threats.reduce(function(a,u){ return Math.min(a,u.y); },1e9);
      var ty = Math.max(240, Math.min(RT-70, front-170));
      var swarm = threats.filter(function(u){ return u.r<=17; }).length;
      var tank  = threats.some(function(u){ return u.max>=1000; });
      var clump = threats.length>=3;

      // limpiar sin regalar deserciones
      if((swarm>=3||clump) && hand.indexOf("purga")>=0){
        var px=threats.reduce(function(a,u){return a+u.x;},0)/threats.length;
        var py=threats.reduce(function(a,u){return a+u.y;},0)/threats.length;
        if(deploy("foe","purga",px,py)) return;
      }
      if(tank && hand.indexOf("mina")>=0 && S.elix.foe>=5){ if(deploy("foe","mina",tx<500?360:640,430)) return; }
      if(hand.indexOf("ballesteras")>=0){ if(deploy("foe","ballesteras",tx,300)) return; }
      if(tank && hand.indexOf("reclutas")>=0){ if(deploy("foe","reclutas",tx,ty)) return; }
      if(hand.indexOf("alabardero")>=0){ if(deploy("foe","alabardero",tx,ty)) return; }
      if(hand.indexOf("reclutas")>=0){ if(deploy("foe","reclutas",tx,ty)) return; }
      return;
    }

    var save = dbl()?7:8;
    if(S.elix.foe>=save){
      var hpL=0,hpR=0;
      S.towers.forEach(function(t){ if(t.side==="me"&&t.kind==="guard"){ if(t.lane===0) hpL=t.hp; else hpR=t.hp; } });
      var weak = hpL<=hpR ? 0 : 1, x = weak===0?260:740;
      if(hand.indexOf("coloso")>=0) { if(deploy("foe","coloso",x,130)) return; }
      if(mine.some(function(u){ return u.max>=2000; }) && hand.indexOf("ballesteras")>=0){
        if(deploy("foe","ballesteras",x,180)) return;
      }
      if(hand.indexOf("ariete")>=0) { if(deploy("foe","ariete",x,RT-80)) return; }
      if(hand.indexOf("alabardero")>=0) { if(deploy("foe","alabardero",x,180)) return; }
    }
  }

  /* ── API pública para la capa gráfica ── */
  return {
    W:W, H:H, RT:RT, RB:RB, BR:BR, BRW:BRW, MATCH:MATCH, DOUBLE:DOUBLE, MAXE:MAXE,
    CARDS:CARDS, DECK:DECK, DESERT_HP:DESERT_HP, DESERT_MAX:DESERT_MAX,
    VETS:DECK.filter(function(k){ return !!CARDS[k].vet; }),
    start:function(){ S=fresh(); EV.length=0; },
    tick:function(dt){ step(dt); },
    deploy:function(side,key,x,y){ return deploy(side,key,x,y); },
    canDeploy:function(side,x,y){ return canDeploy(side,x,y); },
    drain:function(){ var e=EV.slice(); EV.length=0; return e; },
    doubleElixir:function(){ return dbl(); },
    crowns:crowns,
    state:function(){ return S; }
  };
})();

  var WITHER=[1,.86,.74];

    else if(!v.landed){ v.landed=true; dust(u.x,u.y+u.r*.5,u.build?10:7,u.build?"rgba(150,115,80,":null,u.build?90:60);

    else if(sp<1.6){ var q=(sp-1)/.6; sy=1-Math.sin(q*Math.PI)*.16; sx=1+Math.sin(q*Math.PI)*.1; }

        else if(e<.32){ var kk=(e-.2)/.12; x=d.x+(x-d.x)*kk; y=d.y+(y-d.y)*kk; }
        if(e<.34){ pal=PAL[d.from][Math.max(0,(d.turns||1)-1)]; crack=Math.min(1,Math.max(0,(e-.1)/.22)); } // 2 fractura
        if(e>=.34 && !d.shed){ d.shed=true; shedShell(d, x, y-r*.35, r, back); }
      } else if(e<.14){ pal=PAL[d.from][Math.min(2,u.turns)]; }

      var a=showSel?(.10+pulse*.05):Math.max(0,.22*(1-(age-1.1)/1.3));
      cx.fillStyle=col+a+")"; cx.fillRect(c0,ytop,500,RB+30-ytop);
      cx.strokeStyle=col+(showSel?.8:Math.max(0,1-(age-1.1)/1.3))+")"; cx.lineWidth=5;
      cx.beginPath(); cx.moveTo(c0,ytop); cx.lineTo(c0+500,ytop); cx.stroke();
      if(p<1){ for(var i=0;i<6;i++) part({x:c0+Math.random()*500,y:ytop,vx:0,vy:-20,z:0,g:-30,life:.5,size:4,col:"#c9fff0",shape:"mote"}); }
    }
  }
  function drawLate(){ var S=DES.state(), left=DES.MATCH-S.t; if(left>30||S.over) return;
    var p=.5+.5*Math.sin(now*Math.PI*(left<10?4:2)); cx.lineWidth=18; cx.strokeStyle="rgba(255,120,90,"+(.12+p*.3)+")"; cx.strokeRect(9,9,W-18,H-18); }

  /* ═══════════ cartas ═══════════ */
  var CARDCACHE={};
  function cardArt(key,size){
    var c=document.createElement("canvas"), d=2; c.width=c.height=size*d;
    var g=c.getContext("2d"); g.scale(d,d);
    var C=DES.CARDS[key];
    var bg=g.createRadialGradient(size*.5,size*.4,2,size*.5,size*.5,size*.75);
    if(C.spell==="damage"){ bg.addColorStop(0,"#5b2a7a"); bg.addColorStop(1,"#1e0c2a"); }
    else if(C.spell){ bg.addColorStop(0,"#7a5a20"); bg.addColorStop(1,"#2a1d08"); }
    else if(C.vet){ bg.addColorStop(0,"#f4dc98"); bg.addColorStop(1,"#8a6420"); }
    else { bg.addColorStop(0,"#cfe9e2"); bg.addColorStop(1,"#3d6a63"); }
    g.fillStyle=bg; g.fillRect(0,0,size,size);
    var save=cx; cx=g;
    if(C.spell==="damage"){ cx.save(); cx.translate(size/2,size/2); var s=size/130; cx.scale(s,s);
      cx.beginPath(); for(var j=0;j<14;j++){ var a=j/14*6.2832, rq=(j%2?44:50); cx.lineTo(Math.cos(a)*rq,Math.sin(a)*rq); } cx.closePath();
      cx.fillStyle="#9a45d8"; cx.fill(); cx.strokeStyle="#2a0d40"; cx.lineWidth=5; cx.stroke();
      cx.beginPath(); cx.arc(0,0,30,0,6.2832); cx.strokeStyle="#e0b0ff"; cx.lineWidth=3; cx.stroke();
      cx.fillStyle="#f6e4ff"; cx.font="italic 700 40px Georgia,serif"; cx.textAlign="center"; cx.textBaseline="middle"; cx.fillText("E",0,2); cx.restore(); }
    else if(C.spell){ cx.save(); cx.translate(size/2,size/2); var s2=size/120; cx.scale(s2,s2); cx.rotate(-.15);
      cx.fillStyle="#f6ead0"; cx.strokeStyle="#3a2a1c"; cx.lineWidth=3; cx.fillRect(-38,-26,76,52); cx.strokeRect(-38,-26,76,52);
      cx.fillStyle="#3a2a1c"; cx.fillRect(-28,-14,56,4); cx.fillRect(-28,-4,44,4); cx.fillRect(-28,6,30,4);
      cx.beginPath(); cx.arc(24,16,13,0,6.2832); cx.fillStyle="#c22a3c"; cx.fill(); cx.stroke();
      cx.fillStyle=GOLD; cx.beginPath(); cx.moveTo(24,8); cx.lineTo(30,22); cx.lineTo(18,22); cx.closePath(); cx.fill(); cx.restore(); }
    else { var r=size*(key==="coloso"?.25:key==="mina"?.27:.3), y=size*(C.vet?.62:.56);
      var om=now; now=1.2;
      if(C.n>1){ var off=size*.17; figure(C.art,PAL.me[0],size/2-off,y+2,r*.8,{back:false,ph:0,atk:0,seed:1,turns:0});
        figure(C.art,PAL.me[0],size/2+off,y+4,r*.8,{back:false,ph:2,atk:0,seed:3,turns:0}); }
      else figure(C.art,PAL.me[0],size/2,y,r,{back:false,ph:0,atk:0,seed:1,turns:0});
      now=om;
      if(C.n>1){ g.fillStyle="#fff8e6"; g.strokeStyle="#1d1410"; g.lineWidth=3; g.font="700 "+(size*.22)+"px Georgia,serif"; g.textAlign="right"; g.strokeText("×"+C.n,size-2,size-3); g.fillText("×"+C.n,size-2,size-3); } }
    cx=save;
    return c;
  }

  /* ═══════════ HUD ═══════════ */
  function hud(){
    var S=DES.state(), left=Math.max(0,DES.MATCH-S.t);
    var clk=$("clk"); clk.textContent=Math.floor(left/60)+":"+String(Math.floor(left%60)).padStart(2,"0");
    var late=left<=30&&!S.over; if(late!==lateOn){ lateOn=late; clk.classList.toggle("late",late); }
    var dbl=DES.doubleElixir(); $("x2").hidden=!dbl;
    if(dbl&&!wasDbl){ wasDbl=true; SFX.dbl(); var eb=$("elixbar"); eb.classList.remove("pulse"); void eb.offsetWidth; eb.classList.add("pulse"); $("x2").classList.add("pulse");
      banner("¡Sal doble!","#ffd877","último minuto"); }
    $("elixbar").classList.toggle("dbl",dbl);
    $("crM").textContent=DES.crowns("me"); $("crF").textContent=DES.crowns("foe");
    var e=S.elix.me, full=Math.floor(e), frac=e-full, bar=$("elixbar");
    if(bar.children.length!==DES.MAXE){ bar.innerHTML=""; for(var i=0;i<DES.MAXE;i++) bar.appendChild(document.createElement("i")); }
    for(var j=0;j<DES.MAXE;j++){ var el=bar.children[j], cn=j<full?"on":(j===full&&frac>.02?"part":"");
      if(el.className!==cn) el.className=cn; if(j===full) el.style.setProperty("--p",(frac*100).toFixed(0)+"%"); }
    $("elixn").textContent=full;
    var adv=Math.round(((S.spent.foe-S.spent.me)+(S.elix.me-S.elix.foe))*10)/10; if(Object.is(adv,-0)) adv=0;
    $("advN").textContent=(adv>0?"+":"")+adv.toFixed(1);
    var bi=$("advI"); bi.className=adv<0?"neg":""; bi.style.transform="scaleX("+Math.min(1,Math.abs(adv)/8)+")";
    $("desN").textContent=S.deserts.me+"–"+S.deserts.foe;

    var h=$("hand"), sig=S.hand.me.join(",")+"|"+sel+"|"+full;
    if(h.dataset.sig!==sig){ h.dataset.sig=sig; h.innerHTML="";
      S.hand.me.forEach(function(key){ var C=DES.CARDS[key], aff=C.cost<=S.elix.me;
        var b=document.createElement("button"); b.type="button"; b.className="card"+(sel===key?" sel":"")+(aff?"":" off")+(C.vet?" vet":"");
        var cst=document.createElement("span"); cst.className="cst"; cst.textContent=C.cost; b.appendChild(cst);
        b.appendChild(CARDCACHE[key]?cloneCv(CARDCACHE[key]):(CARDCACHE[key]=cardArt(key,56)));
        var n=document.createElement("span"); n.className="nm2"; n.textContent=nm(key); b.appendChild(n);
        if(C.vet){ var vt=document.createElement("span"); vt.className="vtag"; vt.textContent="✦"; b.appendChild(vt); }
        if(!aff){ var f=document.createElement("span"); f.className="fill"; f.style.height=Math.round((1-S.elix.me/C.cost)*100)+"%"; b.appendChild(f); }
        b.addEventListener("click",function(){ if(!aff) return; audioInit(); SFX.tap();
          sel = sel===key ? null : key; h.dataset.sig="";
          if(sel) toast(nm(key)+" · "+C.cost+" de sal", HINT[key]); });
        h.appendChild(b); }); }
    var nx=S.queue.me[S.queue.me.length-1], nw=$("nextWrap");
    if(nw.dataset.k!==nx){ nw.dataset.k=nx; nw.innerHTML=""; if(nx) nw.appendChild(cardArt(nx,24)); }
    var fc=$("foeCards"), fsig=S.hand.foe.join(",")+"|"+S.queue.foe[S.queue.foe.length-1];
    if(fc.dataset.sig!==fsig){ fc.dataset.sig=fsig; fc.innerHTML="";
      function chip(k,next){ var C=DES.CARDS[k], d=document.createElement("span"); d.className="fc"+(C.vet?" v":"")+(next?" nx":"");
        var em=document.createElement("em"); em.textContent=C.cost; d.appendChild(em); d.appendChild(document.createTextNode(nm(k))); fc.appendChild(d); }
      S.hand.foe.forEach(function(k){ chip(k,false); }); var n2=S.queue.foe[S.queue.foe.length-1]; if(n2) chip(n2,true); }
  }
  function cloneCv(src){ var c=document.createElement("canvas"); c.width=src.width; c.height=src.height; c.getContext("2d").drawImage(src,0,0); return c; }
  var tT=0;
  function toast(a,b){ var t=$("toast"); t.innerHTML=""; var bb=document.createElement("b"); bb.textContent=a; t.appendChild(bb);
    if(b){ t.appendChild(document.createElement("br")); t.appendChild(document.createTextNode(b)); } t.hidden=false; tT=2.6; }

  /* ═══════════ entrada ═══════════ */
  function at(ev){
    audioInit();
    var S=DES.state(); if(S.over||paused) return;
    var p=ev.touches?ev.touches[0]:ev, r=cv.getBoundingClientRect();
    var x=(p.clientX-r.left)/SC, y=(p.clientY-r.top)/SC;
    if(x<0||y<0||x>W||y>H||!sel) return;
    var C=DES.CARDS[sel];
    if(!C.spell && !DES.canDeploy("me",x,y)){ toast("Ahí no","Sólo en tu lado de la quebrada."); FX.push({t:"nope",x:x,y:y,age:0,dur:.4}); return; }
    if(DES.deploy("me",sel,x,y)){ sel=null; $("hand").dataset.sig=""; }
  }
  cv.addEventListener("click",at);
  cv.addEventListener("touchstart",function(e){ e.preventDefault(); at(e); },{passive:false});
  addEventListener("pointerdown",audioInit,{once:true});
  $("btnPause").addEventListener("click",function(){ audioInit(); var S=DES.state(); if(S.over) return;
    paused=!paused; $("btnPause").classList.toggle("on",paused); $("btnPause").textContent=paused?"Seguir":"Pausa";
    if(paused) toast("En pausa","Mirá la mano de la Casa Bermeja y calculá el cambio."); });
  $("btnSnd").addEventListener("click",function(){ audioInit(); muted=!muted; if(MST) MST.gain.value=muted?0:.85; $("btnSnd").classList.toggle("on",muted); $("btnSnd").textContent=muted?"Mudo":"Sonido"; });
  $("btnHelp").addEventListener("click",function(){ help=!help; $("btnHelp").classList.toggle("on",help);
    if(help) toast("Acá nadie muere: se cambia de patrón",
      "Los mercenarios VETERANOS (✦ dorado: Capataz, Cobrador, Acreedor) vencidos por tus tropas se pasan a tu casa. Si los voltea un almacén, una garita o un Embargo, se destruyen. El Pagaré trae de vuelta a los tuyos.");
    else $("toast").hidden=true; });

  function finish(){
    var S=DES.state(), cm=DES.crowns("me"), cf=DES.crowns("foe"), won=S.over==="me", draw=S.over==="draw";
    won?SFX.win():SFX.lose();
    var adv=S.spent.foe-S.spent.me;
    $("overBox").innerHTML='<div class="over'+(won?"":(draw?" draw":" lose"))+'">'+
      '<h2>'+(draw?"Empate":(won?"¡La salina es tuya!":"Te ganaron la salina"))+'</h2>'+
      '<div class="big"><span class="coin m">'+cm+'</span><i>almacenes</i><span class="coin f">'+cf+'</span></div>'+
      '<p>Se pasaron a tu casa <b style="color:var(--me-lt)">'+S.deserts.me+'</b> · se pasaron al rival <b style="color:var(--foe-lt)">'+S.deserts.foe+'</b><br>'+
      'Balance de sal: '+(adv>=0?"+":"")+adv+'</p>'+
      '<button class="btn" id="btnAgain" type="button">Otra partida</button></div>';
    $("btnAgain").addEventListener("click",boot);
  }

  /* ═══════════ jugador automático para pruebas (?auto=1). Juega con la misma API que un dedo. ═══════════ */
  var botCd=1;
  function bot(dt){ botCd-=dt; if(botCd>0) return; botCd=.7;
    var S=DES.state(); if(S.over) return; var hand=S.hand.me.filter(function(k){ return DES.CARDS[k].cost<=S.elix.me; }); if(!hand.length) return;
    var foes=S.units.filter(function(u){ return u.side==="foe"; }), near=foes.filter(function(u){ return u.y>RT-200; });
    if(near.length){ var tx=near[0].x, ty=Math.min(H-200,Math.max(RB+60,near[0].y+150));
      if(near.length>=3&&hand.indexOf("purga")>=0){ DES.deploy("me","purga",near[0].x,near[0].y); return; }
      var pref=["alabardero","reclutas","ballesteras","coloso","mina"]; for(var i=0;i<pref.length;i++) if(hand.indexOf(pref[i])>=0){ if(DES.deploy("me",pref[i],tx,ty)) return; } }
    var lost=S.units.filter(function(u){ return u.side==="foe"&&u.origin==="me"; });
    if(lost.length&&hand.indexOf("estandarte")>=0){ DES.deploy("me","estandarte",lost[0].x,lost[0].y); return; }
    if(S.elix.me>=7){ var lane=Math.random()<.5?260:740, k=hand.filter(function(k){ return !DES.CARDS[k].spell&&k!=="mina"; })[0];
      if(k) DES.deploy("me",k,lane,RB+120); }
  }

  /* ═══════════ bucle: paso fijo de 1/60 con acumulador ═══════════ */
  var last=0, acc=0, STEP=1/60;
  function loop(ts){
    requestAnimationFrame(loop);
    if(!last) last=ts;
    var dt=Math.min(.1,(ts-last)/1000); last=ts; now+=dt;
    var wr=$("fieldwrap").getBoundingClientRect();
    if(Math.round(wr.width)!==lastW||Math.round(wr.height)!==lastH||!FIELD) fit();
    var S=DES.state();
    if(!S.over && !paused){ acc+=dt*FAST; while(acc>=STEP){ DES.tick(STEP); acc-=STEP; if(AUTO) bot(STEP); if(DES.state().over) break; } }
    pump();
    // recordar tropas vivas (para dibujar su caída cuando el motor las saca)
    seenUnits={}; S.units.forEach(function(u){ var v=vsOf(u);
      var dx=u.x-v.px, dy=u.y-v.py, dist=Math.hypot(dx,dy);
      if(dist>.15){ v.ph+=dist*.09; if(Math.abs(dy)>.05) v.hy=v.hy*.85+(dy>0?1:-1)*.15; }
      v.px=u.x; v.py=u.y; v.atk=Math.max(0,v.atk-dt); v.flick=Math.max(0,v.flick-dt);
      var dk=Math.exp(-12*dt); v.kbx*=dk; v.kby*=dk;
      seenUnits[u.id]={x:u.x,y:u.y,art:u.art,turns:u.turns,back:v.hy<0,r:u.r*WITHER[Math.min(2,u.turns)]}; });
    for(var i=FX.length-1;i>=0;i--){ FX[i].age+=dt; if(FX[i].age>FX[i].dur) FX.splice(i,1); }
    S.towers.forEach(function(t){ var v=crackSet(t); v.hit=Math.max(0,v.hit-dt*5); });
    if(tT>0){ tT-=dt; if(tT<=0 && !help) $("toast").hidden=true; }
    if(bnT>0) bnT-=dt;
    shakeA*=Math.exp(-7*dt); if(shakeA<.2) shakeA=0;
    // tictac del último medio minuto, que se acelera
    var left=DES.MATCH-S.t; if(!S.over&&!paused&&left<=30){ var iv=left<=10?.5:1; if(now-lastTick>=iv){ lastTick=now; SFX.tick(left<=10); } }

    var k=SC*DPR; cx.setTransform(k,0,0,k,0,0);
    cx.save();
    if(shakeA>0) cx.translate(Math.sin(now*71)*shakeA*.6,Math.cos(now*53)*shakeA*.5);
    cx.fillStyle="#0a0706"; cx.fillRect(-40,-40,W+80,H+80);
    if(FIELD) cx.drawImage(FIELD,0,0,W,H);
    drawBrine(); drawZone();
    // fantasmas y anillos en el piso primero, después todo ordenado por profundidad
    FX.forEach(function(f){ if(f.age>=0 && (f.t==="ring"||f.t==="spawn"||f.t==="purga"||f.t==="pagare")) drawFX(f); });
    var list=[]; S.towers.forEach(function(t){ list.push({y:t.y,t:t}); }); S.units.forEach(function(u){ list.push({y:u.y,u:u}); });
    list.sort(function(a,b){ return a.y-b.y; });
    list.forEach(function(o){ o.t?drawTower(o.t):drawUnit(o.u); });
    FX.forEach(function(f){ if(f.age>=0 && !(f.t==="ring"||f.t==="spawn"||f.t==="purga"||f.t==="pagare")) drawFX(f); });
    drawProjectiles(dt); drawParticles(dt); drawLate();
    cx.restore();
    hud();
    if(DES.state().over && !$("overBox").firstChild) finish();
  }

  function boot(){
    DES.start(); FX.length=0; PT.length=0; PR.length=0; VS={}; TV={}; openLane=[-1,-1]; wasDbl=false; lateOn=false;
    sel=null; paused=false; last=0; acc=0;
    $("overBox").innerHTML=""; $("hand").dataset.sig=""; $("foeCards").dataset.sig=""; $("nextWrap").dataset.k="";
    $("btnPause").classList.remove("on"); $("btnPause").textContent="Pausa"; $("clk").classList.remove("late");
    fit();
    toast("Acá nadie muere: se cambia de patrón","Vencé a un VETERANO (✦) de la Casa Bermeja con tus tropas y se pasa a tu casa. Tocá una carta y después tu lado de la quebrada.");
    tT=5;
  }
  boot();
  requestAnimationFrame(loop);
  return { fit:fit, boot:boot, dbg:DBG, fx:function(){ return FX; } };
})();
</script>
</body>
